<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">
    <title>Xplitleaks Shorts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --accent: #ff0050;
            --accent-hover: #ff3370;
            --text-main: #ffffff;
            --text-sec: #aaaaaa;
            --bg: #000000;
            --btn-bg: rgba(255,255,255,0.12);
            --btn-hover: rgba(255,255,255,0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text-main);
        }

        /* ==================== SCROLL CONTAINER ==================== */
        .scroll-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: var(--bg);
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        /* ==================== SHORT SLIDE ==================== */
        .short-slide {
            width: 100%;
            height: 100vh;
            min-height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
            flex-shrink: 0;
        }

        /* ==================== VIDEO PLAYER ==================== */
        .video-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Gradient overlays for readability */
        .video-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        .video-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Play/Pause overlay hint */
        .play-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            width: 70px;
            height: 70px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .play-hint.show {
            opacity: 1;
        }

        .play-hint i {
            font-size: 1.8rem;
            color: white;
        }

        /* ==================== HEADER (Top) ==================== */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--accent), #00f2ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--btn-bg);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background 0.2s;
            backdrop-filter: blur(10px);
        }

        .top-btn:hover {
            background: var(--btn-hover);
        }

        .top-btn i {
            pointer-events: none;
        }

        /* ==================== RIGHT SIDE CONTROLS ==================== */
        .side-controls {
            position: absolute;
            right: 12px;
            bottom: 80px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .side-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 6px 4px;
            transition: transform 0.15s;
        }

        .side-btn:active {
            transform: scale(0.9);
        }

        .side-btn .icon-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--btn-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: background 0.2s;
            backdrop-filter: blur(10px);
        }

        .side-btn:hover .icon-circle {
            background: var(--btn-hover);
        }

        .side-btn.liked .icon-circle {
            background: var(--accent);
        }

        .side-btn.liked i {
            color: white;
        }

        .side-btn .count {
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .side-btn .label {
            font-size: 0.7rem;
            color: var(--text-sec);
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* ==================== BOTTOM INFO ==================== */
        .bottom-info {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 80px;
            z-index: 10;
            padding-bottom: 8px;
        }

        .creator-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            word-break: break-word;
        }

        .video-title {
            font-size: 0.9rem;
            font-weight: 400;
            color: white;
            line-height: 1.5;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ==================== LOADING STATES ==================== */
        .loading-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== ERROR STATE ==================== */
        .error-slide {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-sec);
            text-align: center;
            padding: 20px;
            gap: 12px;
        }

        .error-slide i {
            font-size: 3rem;
            color: var(--accent);
        }

        .error-slide h2 {
            color: var(--text-main);
            font-size: 1.3rem;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ==================== REPORT MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: flex-end;
            backdrop-filter: blur(5px);
        }

        .modal.open {
            display: flex;
        }

        .modal-sheet {
            background: #1a1a1a;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-header h3 i {
            color: var(--accent);
        }

        .close-modal {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-sec);
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-submit {
            flex: 1;
            padding: 12px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ==================== END OF FEED ==================== */
        .end-of-feed {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-sec);
            gap: 16px;
            text-align: center;
            padding: 20px;
        }

        .end-of-feed i {
            font-size: 3rem;
            color: var(--accent);
        }

        .end-of-feed h3 {
            color: white;
        }

        .refresh-btn {
            padding: 10px 24px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* ==================== DESKTOP LAYOUT ==================== */
        @media (min-width: 768px) {
            .short-slide {
                background: var(--bg);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .slide-inner {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                max-width: 900px;
                width: 100%;
                margin: 0 auto;
                gap: 40px;
            }

            .video-wrapper {
                position: relative;
                width: auto;
                height: 85vh;
                max-height: 85vh;
                aspect-ratio: 9/16;
                max-width: 480px;
                border-radius: 16px;
                overflow: hidden;
                flex-shrink: 0;
                box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            }

            .video-wrapper::after,
            .video-wrapper::before {
                border-radius: 16px;
            }

            .video-wrapper video {
                border-radius: 16px;
            }

            /* Side controls on desktop go to the right of the video */
            .side-controls {
                position: relative;
                right: auto;
                bottom: auto;
                flex-shrink: 0;
                gap: 12px;
            }

            .short-slide .side-controls {
                position: relative;
                right: auto;
                bottom: auto;
                height: auto;
                justify-content: center;
            }

            /* Bottom info inside the video on desktop */
            .bottom-info {
                right: 16px;
                bottom: 24px;
            }

            .top-bar {
                max-width: 900px;
                left: 50%;
                transform: translateX(-50%);
                width: 100%;
                padding: 16px 24px;
            }
        }

        /* ==================== SMALL MOBILE ==================== */
        @media (max-width: 380px) {
            .side-btn .icon-circle {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }

            .bottom-info {
                right: 70px;
            }

            .side-controls {
                right: 8px;
                bottom: 70px;
            }
        }

        /* Mobile nav bar fix */
        @media (max-width: 767px) {
            .short-slide {
                padding-bottom: 56px;
            }
            .bottom-info {
                bottom: calc(56px + env(safe-area-inset-bottom, 0px));
                right: 70px;
            }
        }
    </style>
</head>
<body>

    <div class="scroll-container" id="scrollContainer">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading shorts...</p>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="reportModal" class="modal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h3><i class="fas fa-flag"></i> Report</h3>
                <button class="close-modal" onclick="closeReportModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="reportForm" onsubmit="handleReportSubmit(event)">
                <div class="form-group">
                    <label for="reportReason">Reason *</label>
                    <select id="reportReason" required>
                        <option value="" disabled selected>Select a reason</option>
                        <option value="inappropriate">Inappropriate Content</option>
                        <option value="copyright">Copyright Violation</option>
                        <option value="spam">Spam or Misleading</option>
                        <option value="quality">Poor Quality</option>
                        <option value="underage">Underage Content</option>
                        <option value="violence">Violence or Harmful</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reportDetails">Details (optional)</label>
                    <textarea id="reportDetails" rows="3" placeholder="Describe the issue..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeReportModal()">Cancel</button>
                    <button type="submit" class="btn-submit">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const CONFIG = {
            apiEndpoint: 'https://xplitleaks-api.dylancoral.workers.dev/api',
            sessionId: localStorage.getItem('sessionId') || ('sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now())
        };
        localStorage.setItem('sessionId', CONFIG.sessionId);

        // ==================== STATE ====================
        let videos = [];
        let currentIndex = 0;
        let globalMuted = false;
        let observer;
        let isLoading = false;
        let hasMore = true;
        let currentPage = 1;
        let reportTargetIndex = null;
        let likedSet = new Set(JSON.parse(localStorage.getItem('shorts_liked') || '[]'));
        let siteConfig = {};

        // ==================== URL NORMALIZER ====================
        function resolveMediaUrl(url) {
            if (!url) return '';
            if (url.startsWith('data:')) return url;
            if (url.startsWith('http://') || url.startsWith('https://')) {
                // Fix malformed protocol triple-slash URLs
                if (url.startsWith('https:///')) {
                    const r2 = siteConfig.r2PublicUrl;
                    if (r2) return 'https://' + r2 + '/' + url.slice(9);
                }
                if (url.startsWith('http:///')) {
                    const r2 = siteConfig.r2PublicUrl;
                    if (r2) return 'http://' + r2 + '/' + url.slice(8);
                }
                return url;
            }
            if (url.startsWith('//')) return 'https:' + url;
            // Relative URL - prepend R2 base if available
            if (siteConfig.r2PublicUrl) {
                const base = siteConfig.r2PublicUrl.replace(/\/$/, '');
                const path = url.startsWith('/') ? url : '/' + url;
                return 'https://' + base + path;
            }
            return url;
        }

        // ==================== HELPERS ====================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatNumber(num) {
            if (!num || isNaN(num)) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatTimeAgo(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d)) return '';
            const diff = Math.floor((Date.now() - d) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
            return Math.floor(diff / 604800) + 'w ago';
        }

        async function loadSiteConfig() {
            try {
                const res = await fetch(`${CONFIG.apiEndpoint}/config`);
                siteConfig = await res.json();
                if (siteConfig.placementUrls) {
                    try { window.placementUrls = JSON.parse(siteConfig.placementUrls); } catch(e) {}
                }
            } catch (e) {
                console.error('Config load error:', e);
            }
        }

        // ==================== CREATE SLIDE ====================
        function createSlide(video, index) {
            const id = video.numericId || video.id;
            const isLiked = likedSet.has(id);
            const creator = escapeHtml(video.creatorName || video.creator || 'Unknown');

            const slide = document.createElement('div');
            slide.className = 'short-slide';
            slide.dataset.index = index;
            slide.dataset.id = id;

            const isDesktop = window.innerWidth >= 768;

            slide.innerHTML = `
                ${isDesktop ? '<div class="slide-inner">' : ''}

                <div class="video-wrapper">
                    <video
                        src="${resolveMediaUrl(video.videoUrl || '')}"
                        loop
                        playsinline
                        webkit-playsinline
                        preload="${index < 3 ? 'auto' : 'metadata'}"
                        ${globalMuted ? 'muted' : ''}
                        data-index="${index}"
                    ></video>
                    <div class="play-hint" id="hint-${index}">
                        <i class="fas fa-play"></i>
                    </div>
                    <div class="loading-state" id="loader-${index}">
                        <div class="loading-spinner"></div>
                    </div>
                </div>

                <!-- Top Bar -->
                <div class="top-bar">
                    <a href="index.html" class="logo">Xplitleaks</a>
                    <div class="top-actions">
                        <button class="top-btn" id="muteBtn-${index}" onclick="toggleMute(event)" title="${globalMuted ? 'Unmute' : 'Mute'}">
                            <i class="fas fa-volume-${globalMuted ? 'mute' : 'up'}"></i>
                        </button>
                        <a href="upload.html" class="top-btn" title="Upload">
                            <i class="fas fa-plus"></i>
                        </a>
                        <a href="index.html" class="top-btn" title="Home">
                            <i class="fas fa-home"></i>
                        </a>
                    </div>
                </div>

                <!-- Right Side Controls -->
                <div class="side-controls ${isDesktop ? 'side-controls-desktop' : ''}">
                    <button class="side-btn like-btn ${isLiked ? 'liked' : ''}" onclick="handleLike(event, ${index})" title="Like">
                        <div class="icon-circle">
                            <i class="fas fa-heart"></i>
                        </div>
                        <span class="count" id="like-count-${index}">${formatNumber(video.likes || 0)}</span>
                    </button>

                    <button class="side-btn" onclick="handleDislike(event, ${index})" title="Dislike">
                        <div class="icon-circle">
                            <i class="fas fa-thumbs-down"></i>
                        </div>
                        <span class="label">Dislike</span>
                    </button>

                    <button class="side-btn" onclick="handleShare(event, ${index})" title="Share">
                        <div class="icon-circle">
                            <i class="fas fa-share-nodes"></i>
                        </div>
                        <span class="count" id="share-count-${index}">${formatNumber(video.shares || 0)}</span>
                    </button>

                    <button class="side-btn" onclick="openReport(${index})" title="Report">
                        <div class="icon-circle">
                            <i class="fas fa-flag"></i>
                        </div>
                        <span class="label">Report</span>
                    </button>
                </div>

                <!-- Bottom Info -->
                <div class="bottom-info">
                    <div class="creator-name">@${creator}</div>
                    <div class="video-title">${escapeHtml(video.title || 'Untitled')}</div>
                </div>

                ${isDesktop ? '</div>' : ''}
            `;

            // Wire up video events
            const v = slide.querySelector('video');

            v.addEventListener('loadedmetadata', () => {
                const loader = slide.querySelector(`#loader-${index}`);
                if (loader) loader.remove();
            });

            v.addEventListener('error', () => {
                const loader = slide.querySelector(`#loader-${index}`);
                if (loader) loader.innerHTML = '<p style="color:#ff4444">Failed to load</p>';
            });

            // Tap to play/pause
            let lastTap = 0;
            v.addEventListener('click', (e) => {
                const now = Date.now();
                if (now - lastTap < 300) {
                    handleLike(e, index);
                } else {
                    togglePlay(index);
                }
                lastTap = now;
            });

            return slide;
        }

        // ==================== PLAYBACK ====================
        function togglePlay(index) {
            const slide = document.querySelector(`.short-slide[data-index="${index}"]`);
            if (!slide) return;
            const v = slide.querySelector('video');
            const hint = slide.querySelector(`#hint-${index}`);
            if (!v) return;

            if (v.paused) {
                v.play().catch(() => {});
                if (hint) {
                    hint.querySelector('i').className = 'fas fa-play';
                    hint.classList.add('show');
                    setTimeout(() => hint.classList.remove('show'), 500);
                }
            } else {
                v.pause();
                if (hint) {
                    hint.querySelector('i').className = 'fas fa-pause';
                    hint.classList.add('show');
                    setTimeout(() => hint.classList.remove('show'), 500);
                }
            }
        }

        function playAtIndex(index) {
            const slide = document.querySelector(`.short-slide[data-index="${index}"]`);
            if (!slide) return;
            const v = slide.querySelector('video');
            if (!v) return;
            v.muted = globalMuted;
            v.play().catch(() => {});
        }

        function pauseAtIndex(index) {
            const slide = document.querySelector(`.short-slide[data-index="${index}"]`);
            if (!slide) return;
            const v = slide.querySelector('video');
            if (v) v.pause();
        }

        // ==================== MUTE ====================
        function toggleMute(e) {
            e.stopPropagation();
            globalMuted = !globalMuted;

            document.querySelectorAll('[id^="muteBtn-"]').forEach(btn => {
                btn.innerHTML = `<i class="fas fa-volume-${globalMuted ? 'mute' : 'up'}"></i>`;
                btn.title = globalMuted ? 'Unmute' : 'Mute';
            });

            document.querySelectorAll('video').forEach(v => {
                v.muted = globalMuted;
            });

            localStorage.setItem('shorts_muted', globalMuted ? '1' : '0');
        }

        // ==================== LIKE ====================
        async function handleLike(e, index) {
            if (e) e.stopPropagation();
            const video = videos[index];
            if (!video) return;
            const id = video.numericId || video.id;
            const isLiked = likedSet.has(id);

            const btn = document.querySelector(`.short-slide[data-index="${index}"] .like-btn`);
            const countEl = document.getElementById(`like-count-${index}`);

            if (isLiked) {
                likedSet.delete(id);
                if (btn) btn.classList.remove('liked');
                video.likes = Math.max((video.likes || 0) - 1, 0);
            } else {
                likedSet.add(id);
                if (btn) btn.classList.add('liked');
                video.likes = (video.likes || 0) + 1;
                if (btn) {
                    btn.style.transform = 'scale(1.3)';
                    setTimeout(() => btn.style.transform = '', 200);
                }
            }

            if (countEl) countEl.textContent = formatNumber(video.likes);
            localStorage.setItem('shorts_liked', JSON.stringify([...likedSet]));

            try {
                await fetch(`${CONFIG.apiEndpoint}/short/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Session-Id': CONFIG.sessionId },
                    body: JSON.stringify({ shortId: id })
                });
            } catch (err) {}
        }

        function handleDislike(e, index) {
            e.stopPropagation();
            const btn = e.currentTarget;
            btn.classList.toggle('disliked');
            const icon = btn.querySelector('.icon-circle');
            if (btn.classList.contains('disliked')) {
                icon.style.background = 'rgba(255, 68, 68, 0.5)';
            } else {
                icon.style.background = '';
            }
        }

        // ==================== SHARE ====================
        async function handleShare(e, index) {
            e.stopPropagation();
            const video = videos[index];
            if (!video) return;
            const id = video.numericId || video.id;
            const url = `${window.location.origin}/shorts.html?id=${id}`;

            try {
                await fetch(`${CONFIG.apiEndpoint}/short/share`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Session-Id': CONFIG.sessionId },
                    body: JSON.stringify({ shortId: id })
                });
                video.shares = (video.shares || 0) + 1;
                const el = document.getElementById(`share-count-${index}`);
                if (el) el.textContent = formatNumber(video.shares);
            } catch (err) {}

            if (navigator.share) {
                try {
                    await navigator.share({ title: video.title || 'Check this out!', url });
                } catch (err) {
                    if (err.name !== 'AbortError') copyToClipboard(url);
                }
            } else {
                copyToClipboard(url);
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text)
                .then(() => alert('Link copied!'))
                .catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    alert('Link copied!');
                });
        }

        // ==================== REPORT ====================
        function openReport(index) {
            reportTargetIndex = index;
            document.getElementById('reportModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.remove('open');
            document.body.style.overflow = '';
            document.getElementById('reportForm').reset();
            reportTargetIndex = null;
        }

        async function handleReportSubmit(e) {
            e.preventDefault();
            if (reportTargetIndex === null) return;

            const video = videos[reportTargetIndex];
            const reason = document.getElementById('reportReason').value;
            const details = document.getElementById('reportDetails').value;

            try {
                const res = await fetch(`${CONFIG.apiEndpoint}/report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Session-Id': CONFIG.sessionId },
                    body: JSON.stringify({
                        contentId: video.numericId || video.id,
                        contentType: 'short',
                        reason,
                        details
                    })
                });

                if (res.ok) {
                    alert('Report submitted successfully');
                    closeReportModal();
                } else {
                    alert('Failed to submit report');
                }
            } catch (err) {
                alert('Network error');
            }
        }

        document.getElementById('reportModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeReportModal();
        });

        // ==================== LOAD VIDEOS ====================
        async function loadVideos(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;

            try {
                const container = document.getElementById('scrollContainer');
                if (!append) container.innerHTML = '';

                const eof = document.getElementById('endOfFeed');
                if (eof) eof.remove();

                const excludeIds = videos.map(v => v.numericId || v.id).join(',');

                let data;
                try {
                    const res = await fetch(`${CONFIG.apiEndpoint}/shorts/recommend?sessionId=${CONFIG.sessionId}&limit=10&exclude=${excludeIds}`, { signal: AbortSignal.timeout(10000) });
                    data = await res.json();
                } catch (e) {
                    data = [];
                }

                if (data.shorts) data = data.shorts;
                else if (!Array.isArray(data)) data = [];

                if (data.length === 0) {
                    try {
                        const res = await fetch(`${CONFIG.apiEndpoint}/shorts?page=${page}&limit=10`, { signal: AbortSignal.timeout(10000) });
                        const d = await res.json();
                        data = d.shorts || [];
                    } catch (e) { data = []; }
                }

                if (data.length === 0) {
                    hasMore = false;
                    if (!append) {
                        container.innerHTML = `
                            <div class="error-slide">
                                <i class="fas fa-video-slash"></i>
                                <h2>No shorts available</h2>
                                <a href="index.html" class="home-link"><i class="fas fa-home"></i> Go Home</a>
                            </div>
                        `;
                    } else {
                        const endSlide = document.createElement('div');
                        endSlide.id = 'endOfFeed';
                        endSlide.className = 'end-of-feed';
                        endSlide.innerHTML = `
                            <i class="fas fa-check-circle"></i>
                            <h3>You are all caught up!</h3>
                            <p>You have seen all available shorts.</p>
                            <button class="refresh-btn" onclick="refreshFeed()">
                                <i class="fas fa-redo"></i> Refresh
                            </button>
                        `;
                        container.appendChild(endSlide);
                    }
                    return;
                }

                const startIdx = videos.length;
                videos = videos.concat(data);
                currentPage = page;
                hasMore = data.length >= 10;

                data.forEach((video, i) => {
                    const slide = createSlide(video, startIdx + i);
                    container.appendChild(slide);
                });

                setupObserver();

                if (!append && videos.length > 0) {
                    setTimeout(() => playAtIndex(0), 200);
                }

            } catch (e) {
                console.error('Load error:', e);
                if (!append) {
                    document.getElementById('scrollContainer').innerHTML = `
                        <div class="error-slide">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h2>Failed to load</h2>
                            <button class="refresh-btn" onclick="refreshFeed()" style="margin-top:12px">
                                <i class="fas fa-redo"></i> Retry
                            </button>
                        </div>
                    `;
                }
            } finally {
                isLoading = false;
            }
        }

        function refreshFeed() {
            videos = [];
            currentIndex = 0;
            hasMore = true;
            currentPage = 1;
            loadVideos(1, false);
        }

        // ==================== SCROLL OBSERVER ====================
        function setupObserver() {
            const container = document.getElementById('scrollContainer');

            if (observer) observer.disconnect();

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const idx = parseInt(entry.target.dataset.index);
                        if (isNaN(idx) || idx === currentIndex) return;

                        pauseAtIndex(currentIndex);
                        trackView(currentIndex);
                        currentIndex = idx;
                        playAtIndex(idx);

                        if (idx >= videos.length - 3 && hasMore && !isLoading) {
                            loadVideos(currentPage + 1, true);
                        }
                    }
                });
            }, {
                root: container,
                threshold: 0.55
            });

            document.querySelectorAll('.short-slide[data-index]').forEach(slide => {
                observer.observe(slide);
            });
        }

        // ==================== VIEW TRACKING ====================
        const viewStartTimes = {};

        function trackView(index) {
            const video = videos[index];
            if (!video || !viewStartTimes[index]) return;

            const watched = Date.now() - viewStartTimes[index];
            const seconds = watched / 1000;
            delete viewStartTimes[index];

            if (seconds < 2) return;

            const id = video.numericId || video.id;
            const dur = parseDuration(video.duration);
            const fraction = dur > 0 ? seconds / dur : 0;

            fetch(`${CONFIG.apiEndpoint}/short/view`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Session-Id': CONFIG.sessionId },
                body: JSON.stringify({
                    shortId: id,
                    watchDuration: Math.min(fraction, 1),
                    watchTime: Math.round(seconds)
                })
            }).catch(() => {});
        }

        function parseDuration(dur) {
            if (!dur) return 30;
            if (typeof dur === 'number') return dur;
            const parts = dur.split(':').map(Number);
            if (parts.length === 2) return parts[0] * 60 + parts[1];
            if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            return 30;
        }

        function playAtIndex(index) {
            const slide = document.querySelector(`.short-slide[data-index="${index}"]`);
            if (!slide) return;
            const v = slide.querySelector('video');
            if (!v) return;
            v.muted = globalMuted;
            v.play().catch(() => {});
            viewStartTimes[index] = Date.now();
        }

        // ==================== KEYBOARD NAV ====================
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

            switch (e.key) {
                case 'ArrowDown':
                case 'ArrowRight':
                    e.preventDefault();
                    goToSlide(currentIndex + 1);
                    break;
                case 'ArrowUp':
                case 'ArrowLeft':
                    e.preventDefault();
                    goToSlide(currentIndex - 1);
                    break;
                case ' ':
                    e.preventDefault();
                    togglePlay(currentIndex);
                    break;
                case 'm':
                    toggleMute({ stopPropagation: () => {} });
                    break;
            }
        });

        function goToSlide(index) {
            if (index < 0 || index >= videos.length) return;
            const slide = document.querySelector(`.short-slide[data-index="${index}"]`);
            if (slide) slide.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ==================== TOUCH / SWIPE ====================
        let touchStartY = 0;
        let touchStartTime = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            const diffY = touchStartY - e.changedTouches[0].clientY;
            const diffTime = Date.now() - touchStartTime;
            if (diffTime > 300 || Math.abs(diffY) < 30) return;

            if (diffY > 0) {
                goToSlide(currentIndex + 1);
            } else {
                goToSlide(currentIndex - 1);
            }
        }, { passive: true });

        // ==================== INIT ====================
        async function init() {
            globalMuted = localStorage.getItem('shorts_muted') === '1';
            await loadSiteConfig();
            loadVideos(1, false);
        }

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const wasDesktop = document.querySelector('.slide-inner') !== null;
                const isDesktop = window.innerWidth >= 768;
                if (wasDesktop !== isDesktop && videos.length > 0) {
                    const container = document.getElementById('scrollContainer');
                    container.innerHTML = '';
                    videos.forEach((video, i) => {
                        container.appendChild(createSlide(video, i));
                    });
                    setupObserver();
                    playAtIndex(currentIndex);
                }
            }, 250);
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                pauseAtIndex(currentIndex);
                trackView(currentIndex);
            } else {
                playAtIndex(currentIndex);
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
